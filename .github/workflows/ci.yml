name: GoogleUnlimited CI & Regression Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck Bash Scripts
        run: |
          shellcheck --severity=warning -e SC2034,SC2086,SC2181,SC2016,SC2015,SC2317,SC2120,SC2119,SC2088 google-unlimited.sh
          shellcheck --severity=warning -e SC2034,SC2086,SC2181,SC2016,SC2015,SC2317,SC2120,SC2119,SC2088 tests/*.sh

      - name: Bash Syntax Validation (bash -n)
        run: |
          bash -n google-unlimited.sh
          for f in tests/*.sh; do
            bash -n "$f"
          done

      - name: PowerShell ScriptAnalyzer & Syntax Validation
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $analyzerResults = Invoke-ScriptAnalyzer -Path ./WatchAndUpload.ps1 -Severity Error
          if ($analyzerResults) {
            $analyzerResults | Format-Table -AutoSize
            exit 1
          }

          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput((Get-Content WatchAndUpload.ps1 -Raw), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax and linting checks passed!"

  test-linux:
    name: Linux Regression Tests (Ubuntu)
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3 inotify-tools curl

      - name: Set Executable Permissions
        run: chmod +x google-unlimited.sh tests/*.sh

      - name: Run All Linux Tests
        run: ./tests/run_all_tests.sh

  test-windows:
    name: Windows Regression Tests (PowerShell)
    runs-on: windows-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run All Windows Tests
        shell: pwsh
        run: ./tests/run_all_tests.ps1

  test-macos:
    name: macOS Regression Tests (macOS)
    runs-on: macos-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Executable Permissions
        run: chmod +x google-unlimited.sh tests/*.sh

      - name: Run macOS Regression Tests
        run: |
          ./tests/test_readiness.sh
          ./tests/test_creds.sh
          ./tests/test_dedup.sh
          ./tests/test_permissions.sh
          ./tests/test_watch_paths.sh

      - name: Validate LaunchAgent Plist Configuration (REL-01)
        run: |
          mkdir -p ~/Library/LaunchAgents
          ./google-unlimited.sh help >/dev/null
          # Test generated LaunchAgent plist syntax
          PLIST_PATH="$HOME/Library/LaunchAgents/com.googleunlimited.watcher.plist"
          # Verify plutil lints the KeepAlive dict and ThrottleInterval keys cleanly
          cat << 'EOF' > "$PLIST_PATH"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.googleunlimited.watcher</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/bin/bash</string>
                  <string>/tmp/google-unlimited.sh</string>
                  <string>watch</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <dict>
                  <key>SuccessfulExit</key>
                  <false/>
                  <key>Crashed</key>
                  <true/>
              </dict>
              <key>ThrottleInterval</key>
              <integer>30</integer>
          </dict>
          </plist>
          EOF
          plutil -lint "$PLIST_PATH"
